<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=yes">
    <link rel="stylesheet" href="./styles/styles-homepage.css" />
    <title>Nexdor - Home</title>
</head>

<body>
    <section id="notifications">

    </section>

    <header id="nav-bar">
        <div onClick="window.location.href='./index.html';">
            <img id="logo" src="./icons/logo.png" alt="nexdor-logo">
             <h1>NEXDOR</h1>
        </div>
        <div id="search">
            <input id="search-bar" type="text" placeholder="Търсене на апартамент....">
            <button id="search-btn">
                <img id="search-icon" src="./icons/lens.png" alt="S">
            </button>
        </div>
        <div>
            <img id="settings-icon" src="./icons/settings.png" alt="settings">
        </div>
    </header>

    <main>
        <div id="title">
            <h1 id="block-apt"></h1>
        </div>

        <img id="cloud-line" src="./icons/cloud-line3-2.png" alt="">
        
        <div id="info">
            <div id="msg-section" class="container">
                <div id="msg-headers" class="title">
                    <div class="title-left">
                        <p class="category">Моите съобщения</p>
                        <button id="create-msg" class="create-new">+ Създай</button>
                    </div>
                    
                    <p id="see-all-msg-btn" class="see-all">Виж всички...</p>
                </div>

                <div id="messages" class="msg-list">
                </div>

            </div>

            <div id="event-section" class="container">
                <div id="event-headers" class="title">
                    <div class="title-left">
                        <p class="category">Моите събития</p>
                        <button id="create-evt" class="create-new">+ Създай</button>
                    </div>
                    
                    <p id="see-all-evt-btn" class="see-all">Виж всички...</p>
                </div>

                <div id="event" class="msg-list">
                    
                </div>

            </div>

        </div>
    </main>

    <script type="module" src="./js/homepage.js"></script>
</body>
    <div id="read-msg-event" class="popup-container" hidden>
        <iframe id="read-msg-event-popup" src="./html/pop-ups/read-msg-event.html"></iframe>
    </div>
    <div id="apt-settings" class="popup-container" hidden>
        <iframe id="apt-settings-popup" src="./html/apt-settings/apt-settings.html"></iframe>
    </div>
    <div id="change-name" class="popup-container" hidden>
        <iframe id="change-name-popup" src="./html/apt-settings/change-apt-name.html"></iframe>
    </div>
    <div id="change-password" class="popup-container" hidden>
        <iframe id="change-password-popup" src="./html/apt-settings/change-apt-password.html"></iframe>
    </div>
    <div id="delete-apt" class="popup-container" hidden>
        <iframe id="delete-apt-popup" src="./html/apt-settings/delete-apt.html"></iframe>
    </div>

    <div id="all-msg" class="popup-container">
        <iframe id="all-msg-popup" src="./html/pop-ups/see-all-msg.html"></iframe>
    </div>
    <div id="read-msg" class="popup-container">
        <iframe id="read-msg-popup" src="./html/pop-ups/read-msg-event.html"></iframe>
    </div>
    <div id="new-msg" class="popup-container">
        <iframe id="new-msg-popup" src="./html/pop-ups/new-msg.html"></iframe>
    </div>
    
    <div id="all-event" class="popup-container" hidden>
        <iframe id="all-event-popup" src="./html/pop-ups/see-all-event.html"></iframe>
    </div>
    <div id="read-event" class="popup-container" hidden>
        <iframe id="read-event-popup" src="./html/pop-ups/read-msg-event.html"></iframe>
    </div>
    <div id="new-event" class="popup-container">
        <iframe id="new-event-popup" src="./html/pop-ups/new-event.html"></iframe>
    </div>

    
    
</html>
