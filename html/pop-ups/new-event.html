<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles-popups/styles-new-event.css" />
    <title>New Event</title>
</head>

<body id="popup-body">
    <div id="pop-up">
        <img id="X-icon" src="../../icons/X.png" alt="X">
        
        <div id="top">
            <p>Ново събитие</p>
        </div>

        <div id="topic" class="field">
            <p class="label">Заглавие:</p>
            <input type="text" placeholder="Заглавие на събитието (< 70 символа)">
        </div>
        
        <textarea id="msg" placeholder="(От 1 до 2000 символа)"></textarea>

        <button id="send-btn">Изпрати</button>

        <div id="bottom"></div>

    </div>
    <script type="module" src="../../js/x-btn.js"></script>
    <script type="module" src="../../js/popups/new-evt.js"></script>
</body>
</html>
