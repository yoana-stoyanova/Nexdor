<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=yes">
        <link rel="stylesheet" href="./styles/styles-catalogue.css" />
        <title>Nexdor</title>
</head>

<body>
    <section id="notifications">

    </section>

    <header id="nav-bar">
        <div onClick='window.location.href = "./index.html?nocache=" + new Date().getTime();'>
            <img id="logo" src="./icons/logo.png" alt="nexdor-logo">
             <h1>NEXDOR</h1>
        </div>
        <div id="search">
            <input id="search-bar" type="text" placeholder="Търсене на апартамент....">
            <button id="search-btn">
                <img id="search-icon" src="./icons/lens.png" alt="">
            </button>
        </div>
        <div>
            <img id="profile-icon" src="./icons/settings.png" alt="profile-icon">
        </div>
    </header>

    <img id="cloud-line" src="./icons/cloud-line3-2.png" alt="">

    <main>
        <div id="title">
            <h1 id="block-apt">Апартаменти</h1>
        </div>

        <div id="content">
            <div id="apt-list">
                <!-- APTS -->
            </div>

            <!-- <button id="load-more">Зареди още</button> -->
        </div>

    </main>

    <div id="apt-options-popup">
        <iframe id="apt-options" src="./html/apt-settings/catalogue-options.html"></iframe>
    </div>
    <div class="popup" id="apt-send-msg-popup">
        <iframe id="apt-send-msg" src="./html/pop-ups/new-msg.html"></iframe>
    </div>
    <div class="popup" id="apt-enter-popup">
        <iframe id="apt-enter" src="./html/apt-settings/enter-apt.html"></iframe>
    </div>

    <div class="popup" id="settings-popup">
        <iframe id="block-settings-popup" src="./html/block-settings/block-settings.html"></iframe>
    </div>
    <div class="popup" id="change-block-name-popup" hidden>
        <iframe id="change-block-name" src="./html/block-settings/change-block-name.html"></iframe>
    </div>
    <div class="popup" id="change-block-password-popup" hidden>
        <iframe id="change-block-password" src="./html/block-settings/change-block-password.html"></iframe>
    </div>
    <div class="popup" id="change-block-key-popup" hidden>
        <iframe id="change-block-key" src="./html/block-settings/change-default-key.html"></iframe>
    </div>
    <div class="popup" id="show-apt-passwords-popup" hidden>
        <iframe id="show-apt-passwords" src="./html/block-settings/show-all-passwords.html"></iframe>
    </div>
    <div class="popup" id="delete-block-popup" hidden>
        <iframe id="delete-block" src="./html/block-settings/delete-block.html"></iframe>
    </div>

    <script type="module" src="./js/catalogue.js"></script>
    <script type="module" src="./js/catalogue-settings/show-popup-msgs.js"></script>
    <script type="module" src="./js/get-block.js"></script>

    <script>
        window.addEventListener("pageshow", function (event) {
            if (event.persisted || performance.getEntriesByType("navigation")[0].type === "back_forward") {
                window.location.reload(true);
            }
        });
    </script>
</body>



</html>
